source_atlases:
  - Assets/Generated/quality_fix_v05/projectiles_atlas_source.png
  - Assets/Generated/quality_fix_v05/objects_atlas_source.png
rules:
  non_tileable_margin_px: 1
  generated_atlas_cell_padding: "approximately 20%"
  contact_sheet_preview_padding_px: 18
  reject:
    - flat circular badge with one symbol
    - pure color square, disk, or line placeholder
    - clipped glow, weapon tip, scroll tassel, or object base
  tileable_exception:
    - terrain tiles and walls may touch the canvas edge only when intentionally seamless
