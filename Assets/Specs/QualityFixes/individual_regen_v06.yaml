version: v06
date: 2026-06-14
reason: >
  Regenerate cross-cell pollution chains from individual single-asset sources.
  Prior atlas-based assets could transfer the top or bottom of one sprite into another,
  which makes both the receiver and the original donor incomplete.
rules:
  final_generation_mode: single_asset_source
  atlas_use: concept_only_for_buff_item_material_station_icons
  pollution_chain_policy: regenerate_all_members_not_clean_only
  source_requirements:
    - one complete centered sprite per generated image
    - no neighboring asset, cap, base strip, detached top, detached bottom, or UI frame
    - large chroma-key padding around the full sprite
    - preserve a copied source under Assets/Generated/individual_regen_v06
assets:
  - id: qi_gathering_buff
    content:
      - Content/Buffs/QiGatheringBuff.png
    source: Assets/Generated/individual_regen_v06/qi_gathering_buff__single_source__v06.png
